# Moonraker update manager for klicky_probe
#
# Single source of truth for the update_manager keys. The installer
# (plugin/install.sh → moonraker_update_block) reads this file and
# substitutes path/origin. Manual install: copy from the first
# [update_manager ...] line into moonraker.conf, adjust path/origin,
# then restart Moonraker.

[update_manager klicky_probe]
type: git_repo
path: ~/Klicky-Probe
origin: https://github.com/trongtindev/Klicky-Probe.git
primary_branch: main
install_script: plugin/install.sh
managed_services: klipper
