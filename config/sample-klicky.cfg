# Sample [klicky_probe] configuration
# Prerequisites:
#   - [probe] with pin and offsets (do NOT put dock XY in activate_gcode)
#   - Remove [safe_z_home] / [homing_override] if homing_override: True
#   - For adaptive mesh: [bed_mesh], [exclude_object], Label Objects in slicer
#
# Dock/approach/park are toolhead (machine) coordinates — not gcode/skew frame.
#
# Default flow (auto_attach: True): each mesh/level/probe session attaches then docks.
# Multi-step START without thrash (see docs/gcodes.md F2):
#   G28 PROBE_LOCK=1
#   BED_MESH_CALIBRATE PROBE_LOCK=1
#   UNLOCK_PROBE
#   DETACH_PROBE
# Conditional print-start when already homed:
#   ENSURE_PROBE_DOCKED

[klicky_probe]
# Dock position (toolhead at dock when magnets engage)
dock_x: 0
dock_y: 300
# dock_z:                # omit for gantry/frame dock

# Approach vector (relative): travel from safe point into dock when attaching
# Increase for servo docks so entry sits clear of the deploy arm
approach_x: 30
approach_y: 0
# approach_z: 0

# Detach vector (relative): slide off magnets when docking
detach_x: 0
detach_y: 40
# detach_z: 0

# Features
# homing_override: plugin owns G28 (XY order + Z attach/dock policy)
# auto_attach: single gate — session hooks + mesh/level/accuracy wraps
#   False = full manual ATTACH_PROBE/DETACH_PROBE only (no auto wraps)
# wrap_probe_calibrate: independent of auto_attach
#   Flow: stage XY → attach → probe Z → dock → nozzle paper test (ManualProbe UI)
#   Dock before paper is required (probe tip below nozzle).
# show_ui_macros: True (default) — Mainsail/Fluidd buttons ATTACH_PROBE / DETACH_PROBE
#   (status-object shim; set False to hide buttons; console commands still work)
homing_override: True
auto_attach: True
wrap_probe_calibrate: True
# adaptive_mesh: False   # True = bare BED_MESH_CALIBRATE injects ADAPTIVE=1
# Margin: set [bed_mesh] adaptive_margin (stock default 0), not here
verbose: True

# Speeds / clearance are optional — defaults come from [printer] / sensible values
# travel_speed:        # default = [printer] max_velocity; long XY (stage, dock, paper, …)
# attach_speed / detach_speed / z_speed — dock body + Z clearance
# [probe] speed — only actual bed probe descent (not Klicky travel)
# clearance_z: 25
# z_hop_when_unhomed: True   # uses toolhead.set_position (safe_z_home pattern)
# z_home_x / z_home_y:   # default: bed center − probe offsets
#
# PROBE_ACCURACY auto-stage (default on when auto_attach wraps accuracy):
#   Moves to a safe toolhead XY before stock samples (Klipper itself stays at current XY).
#   Defaults use the same bed-center − probe-offset formula as z_home_*, but are
#   independent — overriding z_home_x/y does NOT move the accuracy target.
# probe_accuracy_move: True
# probe_accuracy_x / probe_accuracy_y:  # omit → derived bed center − probe offsets
# Runtime: PROBE_ACCURACY MOVE=0 | MOVE=1 | X=… Y=…
#
# PROBE_CALIBRATE stage (default on when wrap_probe_calibrate):
#   Same formula as accuracy; independent of z_home_* and probe_accuracy_* overrides.
#   After sample, plugin docks then runs stock ManualProbe (Mainsail TESTZ dialog).
# probe_calibrate_move: True
# probe_calibrate_x / probe_calibrate_y:  # omit → derived bed center − probe offsets
# Runtime: PROBE_CALIBRATE MOVE=0 | MOVE=1 | X=… Y=…
#
# Dock path order (attach/detach):
#   clearance_z → umbilical? → safe_xy_before_dock? (detach only) → L-path entry (safe_dock_travel) → dock body
# See docs/configuration.md — "Dock path order".
#
# safe_dock_travel: True   # L-path to entry (no diagonal through dock)
#
# Umbilical (default False): early waypoint for cable routing before other staging.
#   Defaults umbilical_x/y: 15 — placeholder only; set a free corner on your machine.
#   Not a substitute for safe_xy_before_dock (nozzle clean). If both on: umbilical then safe_xy_before_dock.
#   If both would target the same XY, enable only one (double move is wasteful).
# umbilical: False
# umbilical_x: 15
# umbilical_y: 15
#
# Safe XY before dock (default True; detach only — probe on toolhead):
#   Stages at safe_xy_x/y then dock entry so XY does not sweep past nozzle clean /
#   purge brush (can knock probe off mount). Omit coords → bed center.
#   Disable only if you need shortest path and have no fixed XY obstacles.
# safe_xy_before_dock: True
# safe_xy_x: 5.5
# safe_xy_y: 10
#
# reseat_before_z_home: True  # virtual Z: re-dock+attach if already "attached"
