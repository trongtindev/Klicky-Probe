# Sample [klicky_probe] — comment/uncomment by section.
# Prerequisites:
#   - [probe] pin + offsets (do NOT put dock XY in activate_gcode)
#   - Remove [safe_z_home] / [homing_override] if homing_override: True
#   - Adaptive mesh: [bed_mesh], [exclude_object], Label Objects in slicer
# Dock/approach/park/umbilical/safe_xy = toolhead (machine) coords, not gcode/skew.
# Full reference: docs/configuration.md · flows: docs/gcodes.md

[klicky_probe]
# ── Dock geometry (required) ───────────────────────────────────
dock_x: 0
dock_y: 300
approach_x: 30
approach_y: 0
detach_x: 0
detach_y: 40
# dock_z:                 # omit = gantry/frame dock
# approach_z: 0
# detach_z: 0
# approach2_x: 0          # intermediate approach (side / Euclid docks)
# approach2_y: 0
# approach2_z: 0

# ── Features ───────────────────────────────────────────────────
homing_override: True     # plugin owns G28; off = stock G28
auto_attach: True         # session hooks + mesh/level/accuracy wraps
wrap_probe_calibrate: True  # stage → attach → probe → dock → paper test
# show_ui_macros: False   # default True — Mainsail/Fluidd ATTACH/DETACH/PROBE_CALIBRATE buttons
# adaptive_mesh: True     # bare BED_MESH_CALIBRATE injects ADAPTIVE=1
#                         # margin: [bed_mesh] adaptive_margin (not here)
# dock_before_z_home: False  # default True — physical Z: dock before Z home
# disable_docking: True   # default False — skip all attach/dock (debug)
# debug: True             # default False; verbose defaults True

# ── Motion / safety (omit = derived from [printer] / steppers / probe) ──
# travel_speed:           # default = [printer] max_velocity
# attach_speed: 50
# detach_speed: 75
# z_speed: 20
# clearance_z: 25
# z_hop_when_unhomed: False  # default True
# z_home_x:               # default = bed center − probe offsets
# z_home_y:
# home_first: auto        # auto | x | y
# dock_retries: 0
# reseat_before_z_home: False  # default True — virtual Z re-dock+attach

# ── Dock path  (order: clearance_z → umbilical? → safe_xy? → L-path → body) ──
# safe_dock_travel: False # default True — L-path to entry
# umbilical: True         # default False — early cable/corner waypoint
# umbilical_x: 15         # placeholder; set a free point on your machine
# umbilical_y: 15
# safe_xy_before_dock: False  # default True — detach only; avoid nozzle clean
# safe_xy_x:              # omit both = bed center
# safe_xy_y:

# ── Probe staging (accuracy / calibrate) ───────────────────────
# probe_accuracy_move: False   # default True when auto_attach wraps accuracy
# probe_accuracy_x:            # omit = bed center − probe offsets
# probe_accuracy_y:
# probe_calibrate_move: False  # default True when wrap_probe_calibrate
# probe_calibrate_x:
# probe_calibrate_y:

# ── Optional (park / servo dock) ───────────────────────────────
# park_after: True
# park_x: 0
# park_y: 0
# park_z:                 # omit = keep Z
# dock_servo: True
# servo_name: my_dock_servo
# servo_deploy_angle: 10
# servo_retract_angle: 80
# servo_delay_ms: 250

# ── User gcode hooks (soft-fail extras; omit any) ──────────────
# pre_attach_gcode:
#   STATUS_BUSY
# post_attach_gcode:
#   STATUS_READY
# pre_detach_gcode:
# post_detach_gcode:
# pre_homing_gcode:
# post_homing_gcode:
# pre_leveling_gcode:
# post_leveling_gcode:
# pre_meshing_gcode:
# post_meshing_gcode:
# pre_probe_calibrate_gcode:
# post_probe_calibrate_gcode:
# pre_probe_accuracy_gcode:
# post_probe_accuracy_gcode:
# home_x_gcode:           # hard-fail axis home replacement (sensorless, …)
# home_y_gcode:
