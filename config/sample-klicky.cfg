# Sample [klicky_probe] configuration
# Prerequisites:
#   - [probe] with pin and offsets (do NOT put dock XY in activate_gcode)
#   - Remove [safe_z_home] / [homing_override] if homing_override: True
#   - For adaptive mesh: [bed_mesh], [exclude_object], Label Objects in slicer
#
# Dock/approach/park are toolhead (machine) coordinates — not gcode/skew frame.
#
# Default flow (auto_attach: True): each mesh/level/probe session attaches then docks.
# Multi-step START without thrash (see docs/gcodes.md F2):
#   G28 PROBE_LOCK=1
#   BED_MESH_CALIBRATE PROBE_LOCK=1
#   UNLOCK_PROBE
#   DETACH_PROBE
# Conditional print-start when already homed:
#   ENSURE_PROBE_DOCKED

[klicky_probe]
# Dock position (toolhead at dock when magnets engage)
dock_x: 0
dock_y: 300
# dock_z:                # omit for gantry/frame dock

# Approach vector (relative): travel from safe point into dock when attaching
# Increase for servo docks so entry sits clear of the deploy arm
approach_x: 30
approach_y: 0
# approach_z: 0

# Detach vector (relative): slide off magnets when docking
detach_x: 0
detach_y: 40
# detach_z: 0

# Features
# homing_override: plugin owns G28 (XY order + Z attach/dock policy)
# auto_attach: single gate — session hooks + mesh/level/accuracy wraps
#   False = full manual ATTACH_PROBE/DETACH_PROBE only (no auto wraps)
# wrap_probe_calibrate: independent of auto_attach (paper-test ergonomics)
homing_override: True
auto_attach: True
wrap_probe_calibrate: True
adaptive_mesh: False
adaptive_margin: 5
verbose: True

# Speeds / clearance are optional — defaults come from [printer] / sensible values
# travel_speed: 200
# clearance_z: 25
# z_hop_when_unhomed: True   # uses toolhead.set_position (safe_z_home pattern)
# z_home_x / z_home_y:   # default: bed center − probe offsets
# safe_dock_travel: True      # L-path to entry (no diagonal through dock)
# Safe XY before dock (default True; detach only — probe on toolhead):
#   Stages at safe_xy_x/y then dock entry so XY does not sweep past nozzle clean /
#   purge brush (can knock probe off mount). Omit coords → bed center.
#   Disable only if you need shortest path and have no fixed XY obstacles.
# safe_xy_before_dock: True
# safe_xy_x: 5.5
# safe_xy_y: 10
# reseat_before_z_home: True  # virtual Z: re-dock+attach if already "attached"
